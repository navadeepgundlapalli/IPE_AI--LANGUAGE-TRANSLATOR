<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lingoverse - AI Translator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#110f1d;color:white}
header{text-align:center;padding:35px 15px;background:#211b3b}
h1{color:#a18aff;font-size:36px}
.container{max-width:850px;margin:35px auto;padding:20px}
.card{background:#211d35;padding:25px;border-radius:18px}
select,textarea{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:1px solid #51476e;background:#15132a;color:white;font-size:16px}
textarea{height:150px;resize:vertical}
button{padding:13px 22px;border:0;border-radius:10px;background:#7655ff;color:white;font-size:16px;cursor:pointer;margin:5px}
button:hover{background:#987fff}
.output{background:#15132a;padding:18px;border-radius:10px;min-height:100px;margin-top:15px;white-space:pre-wrap}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>🌍 Lingoverse</h1>
<p>Translate with confidence, not guesswork.</p>
</header>

<div class="container">
<div class="card">
<h2>AI Language Translator</h2>

<select id="from">
<option value="Auto">Auto Detect</option>
<option>English</option>
<option>Telugu</option>
<option>Hindi</option>
<option>Tamil</option>
<option>Kannada</option>
<option>Malayalam</option>
<option>Spanish</option>
<option>French</option>
<option>German</option>
<option>Japanese</option>
<option>Korean</option>
<option>Arabic</option>
</select>

<button onclick="swap()">⇄ Swap</button>

<select id="to">
<option>Telugu</option>
<option>English</option>
<option>Hindi</option>
<option>Tamil</option>
<option>Kannada</option>
<option>Malayalam</option>
<option>Spanish</option>
<option>French</option>
<option>German</option>
<option>Japanese</option>
<option>Korean</option>
<option>Arabic</option>
</select>

<textarea id="input" placeholder="Enter your text here..."></textarea>

<button onclick="translateText()">Translate</button>
<button onclick="clearText()">Clear</button>

<h3>Translation Result</h3>
<div class="output" id="output">Your translation appears here...</div>

<button onclick="copyText()">Copy Translation</button>
<button onclick="speak()">🔊 Listen</button>
</div>
</div>

<footer>© 2026 Lingoverse | AI Language Translator</footer>

<script>
async function translateText(){
 const text=document.getElementById("input").value.trim();
 const from=document.getElementById("from").value;
 const to=document.getElementById("to").value;
 const output=document.getElementById("output");

 if(!text){
  output.textContent="Please enter some text.";
  return;
 }

 output.textContent="Translating...";

 try{
  const url="https://api.mymemory.translated.net/get?q="+
  encodeURIComponent(text)+"&langpair="+
  encodeURIComponent((from==="Auto"?"en":from)+"|"+to);

  const response=await fetch(url);
  const data=await response.json();

  if(data.responseStatus===200){
   output.textContent=data.responseData.translatedText;
  }else{
   output.textContent="Translation failed. Please try again.";
  }
 }catch(error){
  output.textContent="Network error. Please try again.";
 }
}

function swap(){
 const from=document.getElementById("from");
 const to=document.getElementById("to");
 if(from.value==="Auto")return;
 const temp=from.value;
 from.value=to.value;
 to.value=temp;
}

function clearText(){
 document.getElementById("input").value="";
 document.getElementById("output").textContent="Your translation appears here...";
}

function copyText(){
 const text=document.getElementById("output").textContent;
 navigator.clipboard.writeText(text);
}

function speak(){
 const text=document.getElementById("output").textContent;
 const speech=new SpeechSynthesisUtterance(text);
 speech.lang="en-US";
 speechSynthesis.speak(speech);
}
</script>
</body>
</html>
